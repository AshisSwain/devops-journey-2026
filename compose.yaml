services:

  api:
    build:
      context: ./app
    container_name: devops-api
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: devopsdb
      DATABASE_USER: devops
      DATABASE_PASSWORD: devopspass
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: devops-postgres
    environment:
      POSTGRES_DB: devopsdb
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devopspass
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
